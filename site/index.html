<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carey Chou — Infographics & Experiments</title>
  <meta name="description" content="Static infographics and web experiments by Carey Chou." />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }
    header {
      padding: 4rem 1.5rem 2rem;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 0.5rem; }
    .tagline { color: #94a3b8; font-size: 1.15rem; margin: 0; }
    main { max-width: 860px; margin: 0 auto; padding: 0 1.5rem 4rem; width: 100%; flex: 1; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); margin-top: 1.5rem; }
    a.card {
      display: block;
      padding: 1.25rem;
      border: 1px solid #1e293b;
      border-radius: 12px;
      background: #111c33;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s ease, transform .15s ease;
    }
    a.card:hover { border-color: #38bdf8; transform: translateY(-2px); }
    a.card h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
    a.card p { margin: 0; color: #94a3b8; font-size: .9rem; }
    footer { padding: 2rem 1.5rem; text-align: center; color: #64748b; font-size: .85rem; }
    .empty { color: #64748b; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>Carey Chou</h1>
    <p class="tagline">Infographics &amp; web experiments.</p>
  </header>
  <main>
    <section aria-labelledby="work-heading">
      <h2 id="work-heading">Published work</h2>
      <div class="grid">
        <a class="card" href="/hello.html">
          <h2>Hello, world</h2>
          <p>Starter page confirming the deploy pipeline works.</p>
        </a>
        <!-- Add more infographics here as <a class="card"> entries -->
      </div>
    </section>
  </main>
  <footer>
    Built with care · hosted on Cloudflare Pages
  </footer>
</body>
</html>
